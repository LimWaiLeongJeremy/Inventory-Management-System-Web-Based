<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview · Company</title>
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
  <div class="app">

    <!-- Top bar (small screens only) -->
    <header class="topbar">
      <button type="button" class="icon-btn" id="navToggle" aria-label="Open navigation"
              aria-controls="sidebar" aria-expanded="false">
        <span class="icon" style="--icon: url('/assets/icons/menu.svg')"></span>
      </button>
      <a href="/dashboard" class="logo">
        <span class="logo-mark"><img src="assets/icons/logo-mark.svg" alt=""></span>
        <span class="logo-text">Company</span>
      </a>
    </header>

    <!-- Sidebar navigation -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">

      <a href="/dashboard" class="logo">
        <span class="logo-mark"><img src="assets/icons/logo-mark.svg" alt=""></span>
        <span class="logo-text">Company</span>
      </a>

      <!-- Main pages -->
      <nav class="nav-section">
        <p class="nav-label">Workspace</p>
        <ul class="nav-list">
          <li>
            <a href="/dashboard" class="nav-link" data-path="/dashboard">
              <span class="icon" style="--icon: url('/assets/icons/layout-grid.svg')"></span>
              Overview
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-path="/stocktaking">
              <span class="icon" style="--icon: url('/assets/icons/package.svg')"></span>
              Stocktaking
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-path="/transfers">
              <span class="icon" style="--icon: url('/assets/icons/arrow-left-right.svg')"></span>
              Transfers
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-path="/transactions">
              <span class="icon" style="--icon: url('/assets/icons/history.svg')"></span>
              Transaction log
            </a>
          </li>
        </ul>
      </nav>

      <!-- Signed-in user (username and role come from the login session) -->
      <div class="user-area">
        <ul class="user-menu" id="userMenu" role="menu" aria-label="Account" hidden>
          <li role="none">
            <button type="button" class="user-menu-item" id="logoutBtn" role="menuitem">
              <span class="icon" style="--icon: url('/assets/icons/log-out.svg')"></span>
              Log out
            </button>
          </li>
        </ul>

        <button type="button" class="user" id="userBtn"
                aria-haspopup="menu" aria-controls="userMenu" aria-expanded="false">
          <span class="avatar">{{ username[:2] | upper }}</span>
          <span class="user-text">
            <span class="user-name">{{ username }}</span>
            <span class="user-role">{{ role | capitalize }}</span>
          </span>
          <span class="icon icon-sm" style="--icon: url('/assets/icons/chevrons-up-down.svg')"></span>
        </button>
      </div>
    </aside>

    <!-- Dim background behind the open sidebar on small screens -->
    <div class="backdrop" id="navBackdrop" hidden></div>

    <!-- Page content -->
    <main class="content">
      <h1>Overview</h1>
    </main>
  </div>

  <script src="assets/js/dashboard.js"></script>
</body>
</html>
