<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Company name.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="login-title">

      <!-- Header -->
      <header class="card-header">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">COMPANY</div>
          <div>
            <p class="brand-name">Company name.</p>
            <p class="brand-sub">Inventory management</p>
          </div>
        </div>
        <span class="badge">Employee access</span>
      </header>

      <!--Login form -->
      <div class="card-body">
        <h1 id="login-title">Welcome back</h1>
        <p class="subtitle">Log in to your workspace to manage your inventory.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="m3 7 9 6 9-6"/>
              </svg>
              <input id="username" name="username" type="text" autocomplete="username"
                     placeholder="Enter your username" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="11" width="16" height="10" rx="2"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>
              <input id="password" name="password" type="password" autocomplete="current-password"
                     placeholder="Enter your password" required>
              <button type="button" id="togglePassword" class="icon-btn"
                      aria-label="Show password" aria-pressed="false">
                <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3l18 18"/>
                  <path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"/>
                  <path d="M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.9 9.9 0 0 0 5.4-1.6"/>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="row">
            <label class="checkbox">
              <input type="checkbox" id="remember" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="link" id="forgotLink">Forgot password?</a>
          </div>

          <!-- Error / info messages -->
          <p id="formMessage" class="message" role="alert" aria-live="polite" hidden></p>

          <button type="submit" class="btn-primary" id="loginBtn">
            <span class="btn-label">Log in</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14"/>
              <path d="m13 6 6 6-6 6"/>
            </svg>
          </button>
        </form>

        <div class="notice">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="11" width="16" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <p>For authorized employees only. Use the credentials provided by your workspace administrator.</p>
        </div>
      </div>
    </section>

    <p class="help">
      Having trouble logging in?
      <a href="#" class="link" id="contactLink">Contact your administrator</a>
    </p>
  </main>

  <script src="assets/js/login.js"></script>
</body>
</html>
